<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Dr. Soumita's Dental Care Inventory System</h1>
        
        <!-- Stock Form -->
        <form id="inventoryForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="itemName" placeholder="Item Name" class="border p-2 rounded" required>
            <input type="number" id="itemQty" placeholder="Quantity" class="border p-2 rounded" required>
            <input type="number" id="itemThreshold" placeholder="Min. Quantity (Alert Level)" class="border p-2 rounded" required>
            <button type="submit" class="col-span-1 md:col-span-3 bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">Save</button>
        </form>

        <!-- Top Actions -->
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold text-gray-700">Inventory Items</h2>
            <button onclick="exportLowStockPDF()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded shadow transition">
                📄 Export Low Stock PDF
            </button>
        </div>
        
        <!-- Inventory Table -->
        <table class="w-full border-collapse border">
            <thead>
                <tr class="bg-gray-200">
                    <th class="border p-2 text-left">Item Name</th>
                    <th class="border p-2 text-left">Current Stock</th>
                    <th class="border p-2 text-left">Min. Level</th>
                    <th class="border p-2 text-center">Action</th>
                </tr>
            </thead>
            <tbody id="inventoryList"></tbody>
        </table>
    </div>
