<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Soumita's Dental Care Inventory System</title>
    
    <!-- Pre-compiled Tailwind CSS (fixes the production warning) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat versions loaded in head to prevent ReferenceError) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Dr. Soumita's Dental Care Inventory System</h1>
        
        <!-- Stock Form -->
        <form id="inventoryForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="itemName" placeholder="Item Name" class="border p-2 rounded" required>
            <input type="number" id="itemQty" placeholder="Quantity" class="border p-2 rounded" required>
            <input type="number" id="itemThreshold" placeholder="Min. Quantity (Alert Level)" class="border p-2 rounded" required>
            <button type="submit" class="col-span-1 md:col-span-3 bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition">Save</button>
        </form>
        
        <!-- Inventory Table -->
        <table class="w-full border-collapse border">
            <thead>
                <tr class="bg-gray-200">
                    <th class="border p-2 text-left">Item Name</th>
                    <th class="border p-2 text-left">Current Stock</th>
                    <th class="border p-2 text-center">Action</th>
                </tr>
            </thead>
            <tbody id="inventoryList"></tbody>
        </table>
    </div>

    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC1zQBE_wl5RQRQzbTDxMYpjuYOXGF520E",
            authDomain: "dental-care-8094e.firebaseapp.com",
            databaseURL: "https://dental-care-8094e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dental-care-8094e",
            storageBucket: "dental-care-8094e.firebasestorage.app",
            messagingSenderId: "327731999527",
            appId: "1:327731999527:web:465f2abd6aa0f84534ef02",
            measurementId: "G-LE80ZHXSCL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. EmailJS Credentials
        const EMAILJS_PUBLIC_KEY = "J_HmRzqV_3_Xu1vM7";
        const EMAILJS_SERVICE_ID = "service_az6xx4a";
        const EMAILJS_TEMPLATE_ID = "template_l5k8fv7";
        const RECIPIENT_EMAIL = "dentalcaredrsoumitapramanick@gmail.com";

        emailjs.init(EMAILJS_PUBLIC_KEY);

        // Track alerts already sent during this session to prevent spam loops
        const alertedItems = new Set();

        // Form Submit: Add new item to Firestore
        document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('itemName').value.trim();
            const qty = parseInt(document.getElementById('itemQty').value, 10);
            const threshold = parseInt(document.getElementById('itemThreshold').value, 10);

            try {
                await db.collection('inventory').add({ name, qty, threshold });
                document.getElementById('inventoryForm').reset();
            } catch (err) {
                console.error("Error adding item:", err);
            }
        });

        // Load Inventory and Listen for Real-Time Updates
        function loadInventory() {
            const list = document.getElementById('inventoryList');
            
            db.collection('inventory').onSnapshot((snapshot) => {
                list.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isLow = data.qty <= data.threshold;

                    // Trigger alert only once when stock falls to or below threshold
                    if (isLow) {
                        if (!alertedItems.has(doc.id)) {
                            sendLowStockEmail(data.name, data.qty);
                            alertedItems.add(doc.id);
                        }
                    } else {
                        // Reset alert trigger if stock is replenished
                        alertedItems.delete(doc.id);
                    }

                    const row = document.createElement('tr');
                    row.className = isLow ? 'bg-red-100' : '';
                    row.innerHTML = `
                        <td class="border p-2 font-medium">${data.name}</td>
                        <td class="border p-2">
                            ${data.qty} ${isLow ? '<span class="text-red-600 font-bold ml-2">⚠️ কম স্টক!</span>' : ''}
                        </td>
                        <td class="border p-2 text-center">
                            <button onclick="updateQty('${doc.id}', ${data.qty}, -1)" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded mr-2 font-bold">-</button>
                            <button onclick="updateQty('${doc.id}', ${data.qty}, 1)" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded font-bold">+</button>
                        </td>
                    `;
                    list.appendChild(row);
                });
            }, (error) => {
                console.error("Error loading inventory:", error);
            });
        }

        // Update item quantity in Firestore
        async function updateQty(id, currentQty, change) {
            const newQty = currentQty + change;
            if (newQty >= 0) {
                try {
                    await db.collection('inventory').doc(id).update({ qty: newQty });
                } catch (err) {
                    console.error("Error updating quantity:", err);
                }
            }
        }

        // Send Low Stock Email Alert via EmailJS
        function sendLowStockEmail(itemName, currentQty) {
            const templateParams = {
                to_email: RECIPIENT_EMAIL,
                item_name: itemName,
                current_qty: currentQty
            };

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                .then(function(response) {
                    console.log('Low stock alert sent successfully:', response.status, response.text);
                })
                .catch(function(error) {
                    console.error('Failed to send low stock alert:', error);
                });
        }

        window.onload = loadInventory;
    </script>
</body>
</html>
